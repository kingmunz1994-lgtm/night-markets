[build]
builder = "nixpacks"
buildCommand = "npm install"

[deploy]
startCommand = "npx tsx scripts/nightid-api.ts"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.variables]
NODE_ENV = "production"
PORT = "3000"
